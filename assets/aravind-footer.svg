<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="foot-title">
  <title id="foot-title">Learn. Build. Debug. Improve.</title>
  <defs>
    <linearGradient id="foot-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070D"/><stop offset=".5" stop-color="#101D32"/><stop offset="1" stop-color="#080D18"/>
    </linearGradient>
    <linearGradient id="foot-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/>
      <animate attributeName="x1" values="0;.2;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="110" rx="14" fill="url(#foot-bg)"/>
  <path d="M28 30H1172 M28 80H1172" stroke="#93C5FD" stroke-opacity=".18"/>
  <path d="M28 55H1172" stroke="url(#foot-line)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle cx="28" cy="55" r="3" fill="#BAE6FD"/><circle cx="1172" cy="55" r="3" fill="#BAE6FD"/>
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="47" font-size="17" letter-spacing="4" fill="#F4F8FF">LEARN  ·  BUILD  ·  DEBUG  ·  IMPROVE</text>
    <text x="600" y="70" font-size="10" letter-spacing="3" fill="#BAE6FD">A WORK IN PROGRESS — BY DESIGN</text>
  </g>
</svg>
